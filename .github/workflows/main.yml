name: 👑 RDP GOD MODE - FINAL ROBLOX FIX

on:
  workflow_dispatch:

jobs:
  Total-Fix-Gacor:
    runs-on: windows-latest
    timeout-minutes: 1440 

    steps:
      - name: 🛡️ SYSTEM TWEAK (PERFORMANCE)
        run: |
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          netsh int tcp set global autotuninglevel=normal
          # Mengabaikan error service yang tidak diizinkan agar tetap jalan
          $services = @('wuauserv','BITS')
          foreach($s in $services){ Stop-Service -Name $s -Force -ErrorAction SilentlyContinue }

      - name: 🎨 VISUAL OPTIMIZER
        run: |
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" /v VisualFXSetting /t REG_DWORD /d 2 /f
          reg add "HKLM\Software\Policies\Microsoft\Windows NT\Terminal Services" /v ColorDepth /t REG_DWORD /d 2 /f

      - name: 👤 USER SETUP (FIX PASSWORD LENGTH)
        run: |
          # Password dipersingkat menjadi 12 karakter agar tidak error
          $pass = "GacorLurr12!"
          
          # Gunakan PowerShell murni untuk membuat user (lebih stabil dari perintah NET USER)
          $SudoPass = ConvertTo-SecureString $pass -AsPlainText -Force
          New-LocalUser -Name "ROBLOX_USER" -Password $SudoPass -AccountNeverExpires -Description "RDP User"
          Add-LocalGroupMember -Group "Administrators" -Member "ROBLOX_USER"
          
          # Aktifkan Akses RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          
          Write-Host "✅ User ROBLOX_USER Berhasil Dibuat!" -ForegroundColor Green

      - name: 🌐 TAILSCALE TUNNEL
        env:
          TAILSCALE_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "ts.msi"
          Start-Process msiexec.exe -ArgumentList "/i", "ts.msi", "/quiet" -Wait
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_KEY --hostname=god-gacor --accept-routes
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          echo "IP_FIX=$ip" >> $env:GITHUB_ENV

      - name: 📦 ROBLOX STUDIO DOWNLOADER
        run: |
          $Url = "https://setup.rbxcdn.com/RobloxStudioLauncherBeta.exe"
          Invoke-WebRequest -Uri $Url -OutFile "$env:USERPROFILE\Desktop\RobloxStudio.exe"

      - name: 🔄 MONITORING 24/7
        env:
          MY_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          Write-Host "===================================="
          Write-Host "🚀 RDP FINAL FIX READY!" -ForegroundColor Green
          Write-Host "🌐 IP: $env:IP_FIX" -ForegroundColor Cyan
          Write-Host "👤 User: ROBLOX_USER" -ForegroundColor White
          Write-Host "🔐 Pass: GacorLurr12!" -ForegroundColor White
          Write-Host "===================================="
          
          $endTime = (Get-Date).AddHours(23).AddMinutes(50)
          while ((Get-Date) -lt $endTime) { Start-Sleep -Seconds 60 }
