Name: 🚀 RDP ULTRA LIGHT - MOBILE OPTIMIZED V2

on:
  workflow_dispatch:
    inputs:
      duration:
        description: '🕐 Pilih Durasi (Pastikan sesuai limit akun)'
        required: false
        default: '5h50m'
        type: choice
        options:
        - '1h'
        - '3h' 
        - '5h50m'
        - '11h40m'
        - '23h20m'

jobs:
  Ultra-Light-RDP:
    runs-on: windows-latest
    # Menaikkan timeout agar mendukung durasi 23 jam
    timeout-minutes: 1440 
    
    steps:
      - name: 🎯 KHỞI ĐỘNG HỆ THỐNG & OPTIMASI RAM
        run: |
          Write-Host "⚡ Meningkatkan Virtual Memory..." -ForegroundColor Yellow
          # Mengatur PageFile agar sistem lebih stabil
          wmic pagefileset where name="C:\\pagefile.sys" set InitialSize=4096,MaximumSize=8192
          
          Write-Host "📱 RDP ULTRA LIGHT - MOBILE OPTIMIZED" -ForegroundColor Cyan
          Write-Host "🕒 Durasi Terpilih: ${{ github.event.inputs.duration }}" -ForegroundColor Magenta

      - name: ⚡ OPTIMASI PERFORMA EXTREME
        run: |
          Write-Host "│ 🎨 Mematikan semua animasi Windows..." -ForegroundColor White
          # Gabungan tweak visual untuk menghemat bandwidth mobile
          $registryPath = "HKCU:\Control Panel\Desktop"
          Set-ItemProperty -Path $registryPath -Name "UserPreferencesMask" -Value ([byte[]](0x90,0x12,0x03,0x80,0x10,0x00,0x00,0x00))
          Set-ItemProperty -Path $registryPath -Name "VisualFXSetting" -Value 2
          
          # Matikan transparansi Taskbar & Start
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" /v EnableTransparency /t REG_DWORD /d 0 /f
          
          Write-Host "│ 🛑 Menonaktifkan Service Berat..." -ForegroundColor White
          $stopSvc = @("SysMain", "WSearch", "DiagTrack", "wuauserv")
          foreach($svc in $stopSvc) { 
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
            Set-Service -Name $svc -StartupType Disabled 
          }

      - name: 👤 KONFIGURASI USER & RDP
        run: |
          $password = "MobileRDP123!" # Kamu bisa ganti atau pakai generator lagi
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "MOBILE-RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "MOBILE-RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "MOBILE-RDP"
          
          # Aktifkan RDP & Bypass Firewall
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: 🌐 KONEKSI TAILSCALE
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if (-not $env:TAILSCALE_AUTH_KEY) { 
            Write-Error "❌ Error: TAILSCALE_AUTH_KEY is missing in Secrets!"
            exit 1 
          }
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "ts.msi"
          Start-Process msiexec.exe -ArgumentList "/i", "ts.msi", "/quiet" -Wait
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=mobile-rdp
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: 🎉 TAMPILKAN INFO LOGIN
        run: |
          Write-Host "🚀 RDP SIAP DIGUNAKAN!" -ForegroundColor Green
          Write-Host "🌐 IP: $env:TAILSCALE_IP" -ForegroundColor Cyan
          Write-Host "👤 User: MOBILE-RDP" -ForegroundColor White
          Write-Host "🔐 Pass: $env:RDP_PASS" -ForegroundColor White
          Write-Host "--------------------------------------------"
          Write-Host "📱 Gunakan Aplikasi 'Remote Desktop' di Android/iOS"
          Write-Host "⚙️  Set 'Color Depth' ke 16-bit di HP kamu."

      - name: ⏳ KEEP ALIVE LOOP (ANTI-IDLE)
        run: |
          $durationInput = "${{ github.event.inputs.duration }}"
          # Logika konversi durasi ke menit
          $totalMinutes = 350
          if ($durationInput -eq "1h") { $totalMinutes = 60 }
          elseif ($durationInput -eq "3h") { $totalMinutes = 180 }
          elseif ($durationInput -eq "11h40m") { $totalMinutes = 700 }
          elseif ($durationInput -eq "23h20m") { $totalMinutes = 1400 }

          $stopTime = (Get-Date).AddMinutes($totalMinutes)
          
          while ((Get-Date) -lt $stopTime) {
            $rem = $stopTime - (Get-Date)
            Write-Host "`rSisa Waktu: $($rem.Hours)h $($rem.Minutes)m - Server Aktif..." -NoNewline -ForegroundColor Cyan
            # Ping ke google agar session tidak idle
            Test-Connection google.com -Count 1 > $null
            Start-Sleep -Seconds 60
          }
