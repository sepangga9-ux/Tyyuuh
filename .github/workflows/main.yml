Name: 🚀 RDP GACOR EDITION - ULTRA LIGHT MOBILE

on:
  workflow_dispatch:
    inputs:
      duration:
        description: '🕐 Pilih Durasi'
        required: false
        default: '5h50m'
        type: choice
        options:
        - '1h'
        - '3h' 
        - '5h50m'
        - '11h40m'
        - '23h20m'

jobs:
  Gacor-RDP:
    runs-on: windows-latest
    timeout-minutes: 1440 
    
    steps:
      - name: 🚀 TWEAK SYSTEM GACOR (CPU & RAM)
        run: |
          Write-Host "⚡ Mengaktifkan Mode Performa Maksimal..." -ForegroundColor Cyan
          # Set Power Plan ke High Performance
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          
          Write-Host "⚡ Optimasi Jaringan (BBR/CTCP) untuk Mobile..." -ForegroundColor Green
          netsh int tcp set global autotuninglevel=normal
          netsh int tcp set global congestionprovider=ctcp
          netsh int tcp set global ecncapability=enabled
          
          Write-Host "🧹 Debloating Windows Services..." -ForegroundColor Yellow
          # Matikan Windows Defender (biar enteng)
          Set-MpPreference -DisableRealtimeMonitoring $true
          # Matikan Telemetry & Error Reporting
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection" /v AllowTelemetry /t REG_DWORD /d 0 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting" /v Disabled /t REG_DWORD /d 1 /f

      - name: 🎨 OPTIMASI VISUAL EXTREME (NO LAG)
        run: |
          Write-Host "⚡ Menghapus semua beban grafis..." -ForegroundColor Magenta
          $VisualPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects"
          if (!(Test-Path $VisualPath)) { New-Item -Path $VisualPath -Force }
          Set-ItemProperty -Path $VisualPath -Name "VisualFXSetting" -Value 2
          
          # Matikan Wallpaper & Animasi secara permanen via Registry
          reg add "HKCU\Control Panel\Desktop" /v Wallpaper /t REG_SZ /d "" /f
          reg add "HKCU\Control Panel\Desktop" /v UserPreferencesMask /t REG_BINARY /d 9012038010000000 /f
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" /v EnableTransparency /t REG_DWORD /d 0 /f

      - name: 👤 SETUP USER GACOR
        run: |
          $pass = "GacorLurr123!"
          $sPass = ConvertTo-SecureString $pass -AsPlainText -Force
          New-LocalUser -Name "GACOR-USER" -Password $sPass -AccountNeverExpires -Description "Optimized for Mobile"
          Add-LocalGroupMember -Group "Administrators" -Member "GACOR-USER"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "GACOR-USER"
          
          # Aktifkan RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          echo "PASS=$pass" >> $env:GITHUB_ENV

      - name: 🌐 KONEKSI TAILSCALE (GACOR NET)
        env:
          TAILSCALE_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "ts.msi"
          Start-Process msiexec.exe -ArgumentList "/i", "ts.msi", "/quiet" -Wait
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_KEY --hostname=rdp-gacor --accept-routes
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          echo "IP_GACOR=$ip" >> $env:GITHUB_ENV

      - name: 🎉 INFO LOGIN & TIPS
        run: |
          Write-Host ""
          Write-Host "┌────────────────────────────────────────┐" -ForegroundColor Cyan
          Write-Host "│       🚀 RDP GACOR EDITION READY       │" -ForegroundColor Cyan
          Write-Host "├────────────────────────────────────────┤" -ForegroundColor Cyan
          Write-Host "│ 🌐 IP: $env:IP_GACOR" -ForegroundColor Green
          Write-Host "│ 👤 User: GACOR-USER" -ForegroundColor White
          Write-Host "│ 🔐 Pass: $env:PASS" -ForegroundColor White
          Write-Host "└────────────────────────────────────────┘" -ForegroundColor Cyan
          Write-Host "💡 TIPS BIAR MAKIN GACOR:" -ForegroundColor Yellow
          Write-Host "1. Di HP, gunakan resolusi 800x600 agar kursor enteng."
          Write-Host "2. Matikan fitur 'Sound' di aplikasi RDP HP."
          Write-Host "3. Gunakan koneksi 4G/WiFi stabil."

      - name: ⏳ KEEP-ALIVE GACOR MODE
        run: |
          $min = 350
          if ("${{ github.event.inputs.duration }}" -eq "1h") { $min = 60 }
          elseif ("${{ github.event.inputs.duration }}" -eq "3h") { $min = 180 }
          elseif ("${{ github.event.inputs.duration }}" -eq "11h40m") { $min = 700 }
          elseif ("${{ github.event.inputs.duration }}" -eq "23h20m") { $min = 1400 }

          $end = (Get-Date).AddMinutes($min)
          while ((Get-Date) -lt $end) {
              $left = $end - (Get-Date)
              # Pantau status service RDP agar tidak mati
              $svc = Get-Service TermService
              if ($svc.Status -ne 'Running') { Start-Service TermService }
              
              Write-Host "`r[GACOR MODE] Sisa waktu: $($left.Hours)j $($left.Minutes)m. Status: STABIL" -NoNewline -ForegroundColor Cyan
              Start-Sleep -Seconds 60
          }
