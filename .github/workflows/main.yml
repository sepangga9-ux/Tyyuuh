name: 👑 RDP GOD MODE - ROBLOX STUDIO

on:
  workflow_dispatch:

jobs:
  Roblox-Gacor:
    runs-on: windows-latest
    timeout-minutes: 1440 

    steps:
      - name: 🛡️ SYSTEM TWEAK (MAX PERFORMANCE)
        run: |
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          netsh int tcp set global autotuninglevel=normal
          # Matikan service berat
          $services = @('wuauserv','BITS','WSearch')
          foreach($s in $services){ Stop-Service -Name $s -Force -ErrorAction SilentlyContinue; Set-Service -Name $s -StartupType Disabled -ErrorAction SilentlyContinue }

      - name: 🎨 GRAPHICS OPTIMIZER (GPU EMULATOR)
        run: |
          Write-Host "⚡ Mengoptimalkan Windows untuk Rendering Software..." -ForegroundColor Magenta
          # Force Windows prioritaskan performa daripada tampilan
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" /v VisualFXSetting /t REG_DWORD /d 2 /f
          # Tweak khusus agar Windows Server mau jalanin aplikasi OpenGL/DirectX tanpa GPU
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer" /v "Scaling" /t REG_DWORD /d 100 /f

      - name: 👤 USER & RDP SETUP
        run: |
          $pass = "GodMode1000!"
          $sPass = ConvertTo-SecureString $pass -AsPlainText -Force
          New-LocalUser -Name "ROBLOX-USER" -Password $sPass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "ROBLOX-USER"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          echo "PASS=$pass" >> $env:GITHUB_ENV

      - name: 🌐 TAILSCALE TUNNEL
        env:
          TAILSCALE_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "ts.msi"
          Start-Process msiexec.exe -ArgumentList "/i", "ts.msi", "/quiet" -Wait
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_KEY --hostname=roblox-gacor --accept-routes
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          echo "IP_GACOR=$ip" >> $env:GITHUB_ENV

      - name: 📦 INSTALL ROBLOX STUDIO (AUTO)
        run: |
          Write-Host "📥 Mendownload Roblox Studio..." -ForegroundColor Cyan
          $Url = "https://setup.rbxcdn.com/RobloxStudioLauncherBeta.exe"
          Invoke-WebRequest -Uri $Url -OutFile "$env:USERPROFILE\Desktop\RobloxStudio.exe"
          Write-Host "✅ Installer sudah siap di Desktop!" -ForegroundColor Green

      - name: 🔄 MONITORING 24/7
        env:
          MY_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          $endTime = (Get-Date).AddHours(23).AddMinutes(50)
          while ((Get-Date) -lt $endTime) {
              # Menjaga proses RDP tetap prioritas tinggi
              Get-Process | Where-Object {$_.Name -like "*Roblox*"} | ForEach-Object { $_.PriorityClass = 'High' }
              Start-Sleep -Seconds 60
          }
