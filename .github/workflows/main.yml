name: 🎮 RDP OPTIMIZED FOR ROBLOX STUDIO

on:
  workflow_dispatch:
    inputs:
      duration:
        description: '🕐 Thời gian sử dụng'
        required: false
        default: '5h50m'
        type: choice
        options:
        - '3h'
        - '5h50m'
        - '11h40m'
        - '23h20m'
      performance_mode:
        description: '⚡ Performance Mode'
        required: false
        default: 'roblox-optimized'
        type: choice
        options:
        - 'roblox-optimized'
        - 'balanced'
        - 'ultra-performance'

jobs:
  Roblox-Studio-RDP:
    runs-on: windows-latest
    timeout-minutes: 1440
    
    steps:
      # BANNER
      - name: 🎯 KHỞI ĐỘNG ROBLOX STUDIO RDP
        run: |
          Write-Host ""
          Write-Host "═══════════════════════════════════════════" -ForegroundColor Cyan
          Write-Host "   🎮 RDP OPTIMIZED FOR ROBLOX STUDIO" -ForegroundColor Yellow
          Write-Host "═══════════════════════════════════════════" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "⚙️  Performance: ${{ github.event.inputs.performance_mode }}" -ForegroundColor Green
          Write-Host "⏰  Duration: ${{ github.event.inputs.duration }}" -ForegroundColor Magenta
          Write-Host "🖥️  RAM: 7 GB | Storage: ~14 GB" -ForegroundColor White
          Write-Host "🎨  Optimized for 3D Editing & Building" -ForegroundColor Cyan
          Write-Host ""
          
          $frames = @('⣾', '⣽', '⣻', '⢿', '⡿', '⣟', '⣯', '⣷')
          for($i=0; $i -lt 12; $i++) {
              Write-Host "`r🚀 Initializing Roblox environment... $($frames[$i % 8])" -NoNewline -ForegroundColor Blue
              Start-Sleep -Milliseconds 100
          }
          Write-Host "`r✅ System ready for Roblox Studio!          " -ForegroundColor Green
          Write-Host ""

      # SYSTEM INFO
      - name: 📊 SYSTEM INFORMATION
        run: |
          Write-Host "═══════════════════════════════════════════" -ForegroundColor Yellow
          Write-Host "           📊 SYSTEM RESOURCES" -ForegroundColor Yellow
          Write-Host "═══════════════════════════════════════════" -ForegroundColor Yellow
          
          $os = Get-WmiObject Win32_OperatingSystem
          $totalRAM = [math]::Round($os.TotalVisibleMemorySize/1MB, 2)
          $freeRAM = [math]::Round($os.FreePhysicalMemory/1MB, 2)
          $usedRAM = [math]::Round($totalRAM - $freeRAM, 2)
          
          Write-Host "🧠 RAM:" -ForegroundColor Cyan
          Write-Host "   Total: $totalRAM GB" -ForegroundColor White
          Write-Host "   Free: $freeRAM GB" -ForegroundColor Green
          Write-Host "   Used: $usedRAM GB" -ForegroundColor Yellow
          
          $cpu = Get-WmiObject Win32_Processor
          Write-Host ""
          Write-Host "⚙️  CPU:" -ForegroundColor Cyan
          Write-Host "   Name: $($cpu.Name)" -ForegroundColor White
          Write-Host "   Cores: $($cpu.NumberOfCores)" -ForegroundColor White
          Write-Host "   Threads: $($cpu.NumberOfLogicalProcessors)" -ForegroundColor White
          
          $disk = Get-PSDrive C
          $freeDisk = [math]::Round($disk.Free/1GB, 2)
          $usedDisk = [math]::Round($disk.Used/1GB, 2)
          $totalDisk = [math]::Round(($disk.Free + $disk.Used)/1GB, 2)
          
          Write-Host ""
          Write-Host "💾 Storage (C:):" -ForegroundColor Cyan
          Write-Host "   Total: $totalDisk GB" -ForegroundColor White
          Write-Host "   Free: $freeDisk GB" -ForegroundColor Green
          Write-Host "   Used: $usedDisk GB" -ForegroundColor Yellow
          
          $gpu = Get-WmiObject Win32_VideoController
          Write-Host ""
          Write-Host "🎨 Graphics:" -ForegroundColor Cyan
          Write-Host "   $($gpu.Name)" -ForegroundColor White
          Write-Host "   VRAM: $([math]::Round($gpu.AdapterRAM/1GB, 2)) GB" -ForegroundColor White
          Write-Host ""

      # DEEP CLEANUP
      - name: 🧹 DEEP CLEANUP & OPTIMIZATION
        run: |
          Write-Host "═══════════════════════════════════════════" -ForegroundColor Yellow
          Write-Host "    🧹 DEEP CLEANUP FOR MAX PERFORMANCE" -ForegroundColor Yellow
          Write-Host "═══════════════════════════════════════════" -ForegroundColor Yellow
          Write-Host ""
          
          Write-Host "⏹️  Stopping unnecessary processes..." -ForegroundColor Cyan
          $processesToStop = @(
              'OneDrive', 'Teams', 'Skype', 'msedge', 
              'MicrosoftEdge*', 'SearchApp', 'SearchUI'
          )
          foreach($proc in $processesToStop) {
              Get-Process -Name $proc -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          
          Write-Host "🛑 Disabling unnecessary services..." -ForegroundColor Cyan
          $servicesToDisable = @(
              'WSearch', 'SysMain', 'DiagTrack', 'TabletInputService', 
              'Themes', 'WbioSrvc', 'fhsvc', 'MapsBroker', 'lfsvc', 
              'RetailDemo', 'WMPNetworkSvc', 'XblAuthManager', 
              'XblGameSave', 'XboxNetApiSvc', 'XboxGipSvc'
          )
          
          foreach($svc in $servicesToDisable) {
              try {
                  Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
                  Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
                  Write-Host "  ✓ Disabled: $svc" -ForegroundColor Green
              } catch {
                  # Ignore
              }
          }
          
          Write-Host ""
          Write-Host "🗑️  Cleaning temporary files..." -ForegroundColor Cyan
          
          $tempPaths = @(
              "$env:TEMP\*",
              "C:\Windows\Temp\*",
              "C:\Windows\Prefetch\*",
              "C:\Windows\SoftwareDistribution\Download\*",
              "$env:LOCALAPPDATA\Microsoft\Windows\INetCache\*",
              "$env:LOCALAPPDATA\Microsoft\Windows\WebCache\*",
              "$env:LOCALAPPDATA\Temp\*"
          )
          
          $freedSpace = 0
          foreach($path in $tempPaths) {
              try {
                  $before = (Get-ChildItem -Path ($path -replace '\\\*$', '') -Recurse -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum
                  Remove-Item -Path $path -Recurse -Force -ErrorAction SilentlyContinue
                  $freedSpace += $before
              } catch {
                  # Continue
              }
          }
          
          Write-Host "  ✓ Freed: $([math]::Round($freedSpace/1MB, 2)) MB" -ForegroundColor Green
          
          Write-Host ""
          Write-Host "📝 Clearing event logs..." -ForegroundColor Cyan
          wevtutil el | ForEach-Object { wevtutil cl $_ 2>$null }
          Write-Host "  ✓ Event logs cleared" -ForegroundColor Green
          
          Write-Host ""
          Write-Host "✅ Deep cleanup completed!" -ForegroundColor Green
          Write-Host ""

      # ROBLOX STUDIO OPTIMIZATION
      - name: ⚡ ROBLOX STUDIO OPTIMIZATION
        run: |
          Write-Host "═══════════════════════════════════════════" -ForegroundColor Yellow
          Write-Host "      ⚡ ROBLOX STUDIO OPTIMIZATION" -ForegroundColor Yellow
          Write-Host "═══════════════════════════════════════════" -ForegroundColor Yellow
          Write-Host ""
          
          $perfMode = "${{ github.event.inputs.performance_mode }}"
          
          switch ($perfMode) {
              'ultra-performance' {
                  $colorDepth = 4
                  $resolution = @(1920, 1080)
                  $compression = 0
                  $visualFX = $true
                  $fontSmooth = $true
                  Write-Host "🚀 Mode: ULTRA PERFORMANCE (Best Quality)" -ForegroundColor Magenta
              }
              'balanced' {
                  $colorDepth = 3
                  $resolution = @(1600, 900)
                  $compression = 1
                  $visualFX = $false
                  $fontSmooth = $true
                  Write-Host "⚖️  Mode: BALANCED (Quality + Speed)" -ForegroundColor Yellow
              }
              default {
                  $colorDepth = 3
                  $resolution = @(1366, 768)
                  $compression = 1
                  $visualFX = $false
                  $fontSmooth = $true
                  Write-Host "🎮 Mode: ROBLOX OPTIMIZED (Recommended)" -ForegroundColor Green
              }
          }
          
          Write-Host "   Resolution: $($resolution[0])x$($resolution[1])" -ForegroundColor Cyan
          Write-Host "   Color Depth: $($colorDepth * 8)-bit" -ForegroundColor Cyan
          Write-Host "   Compression: $(if($compression){'ON'}else{'OFF'})" -ForegroundColor Cyan
          Write-Host ""
          
          Write-Host "🎨 Configuring visual effects for 3D work..." -ForegroundColor Cyan
          
          if ($visualFX) {
              Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Name "EnableTransparency" -Value 1 -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" -Name "VisualFXSetting" -Value 1 -Force -ErrorAction SilentlyContinue
              Write-Host "  ✓ Visual effects enabled (Better for 3D)" -ForegroundColor Green
          } else {
              Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Name "EnableTransparency" -Value 0 -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" -Name "VisualFXSetting" -Value 2 -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path "HKCU:\Control Panel\Desktop\WindowMetrics" -Name "MinAnimate" -Value "0" -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" -Name "TaskbarAnimations" -Value 0 -Force -ErrorAction SilentlyContinue
              Write-Host "  ✓ Minimal visual effects (Max performance)" -ForegroundColor Green
          }
          
          if ($fontSmooth) {
              Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "FontSmoothing" -Value "2" -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "FontSmoothingType" -Value 2 -Force -ErrorAction SilentlyContinue
              Write-Host "  ✓ Font smoothing enabled (Better readability)" -ForegroundColor Green
          }
          
          Write-Host ""
          Write-Host "🌐 Optimizing RDP for 3D rendering..." -ForegroundColor Cyan
          
          $rdpPath = "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"
          
          Set-ItemProperty -Path $rdpPath -Name "ColorDepth" -Value $colorDepth -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $rdpPath -Name "fEnableCompression" -Value $compression -Force -ErrorAction SilentlyContinue
          
          if ($visualFX) {
              Set-ItemProperty -Path $rdpPath -Name "fDisableThemes" -Value 0 -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $rdpPath -Name "fDisableWallpaper" -Value 0 -Force -ErrorAction SilentlyContinue
          } else {
              Set-ItemProperty -Path $rdpPath -Name "fDisableThemes" -Value 1 -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $rdpPath -Name "fDisableWallpaper" -Value 1 -Force -ErrorAction SilentlyContinue
          }
          
          Set-ItemProperty -Path $rdpPath -Name "fDisableCursorShadow" -Value 0 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $rdpPath -Name "fDisableCursorBlink" -Value 0 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $rdpPath -Name "fDisableMenuAnims" -Value 1 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $rdpPath -Name "fDisableFullWindowDrag" -Value 1 -Force -ErrorAction SilentlyContinue
          
          Write-Host "  ✓ RDP configured for 3D workload" -ForegroundColor Green
          
          Write-Host ""
          Write-Host "🌐 Optimizing network for low latency..." -ForegroundColor Cyan
          
          netsh int tcp set global autotuninglevel=normal | Out-Null
          netsh int tcp set global chimney=disabled | Out-Null
          netsh int tcp set global rss=enabled | Out-Null
          netsh int tcp set global netdma=disabled | Out-Null
          netsh int tcp set global dca=enabled | Out-Null
          netsh int tcp set global ecncapability=enabled | Out-Null
          netsh int tcp set supplemental template=internet congestionprovider=ctcp | Out-Null
          
          Write-Host "  ✓ Network optimized for low latency" -ForegroundColor Green
          
          Write-Host ""
          Write-Host "⚡ Setting high performance power plan..." -ForegroundColor Cyan
          
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c | Out-Null
          powercfg /change monitor-timeout-ac 0 | Out-Null
          powercfg /change disk-timeout-ac 0 | Out-Null
          powercfg /change standby-timeout-ac 0 | Out-Null
          
          Write-Host "  ✓ High performance mode activated" -ForegroundColor Green
          
          Write-Host ""
          Write-Host "🔧 Applying registry performance tweaks..." -ForegroundColor Cyan
          
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "MenuShowDelay" -Value "0" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKCU:\Control Panel\Mouse" -Name "MouseSpeed" -Value "0" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKCU:\Control Panel\Mouse" -Name "MouseThreshold1" -Value "0" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKCU:\Control Panel\Mouse" -Name "MouseThreshold2" -Value "0" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKCU:\Control Panel\Mouse" -Name "MouseHoverTime" -Value "100" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKCU:\Control Panel\Keyboard" -Name "KeyboardDelay" -Value "0" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKCU:\Control Panel\Keyboard" -Name "KeyboardSpeed" -Value "31" -Force -ErrorAction SilentlyContinue
          
          Write-Host "  ✓ Registry tweaks applied" -ForegroundColor Green
          
          Write-Host ""
          Write-Host "🎨 Optimizing GPU settings..." -ForegroundColor Cyan
          
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Avalon.Graphics" -Name "DisableHWAcceleration" -Value 0 -Force -ErrorAction SilentlyContinue
          
          Write-Host "  ✓ Hardware acceleration enabled" -ForegroundColor Green
          
          echo "RDP_COLOR_DEPTH=$colorDepth" >> $env:GITHUB_ENV
          echo "RDP_WIDTH=$($resolution[0])" >> $env:GITHUB_ENV
          echo "RDP_HEIGHT=$($resolution[1])" >> $env:GITHUB_ENV
          echo "RDP_COMPRESSION=$compression" >> $env:GITHUB_ENV
          
          Write-Host ""
          Write-Host "✅ Roblox Studio optimization completed!" -ForegroundColor Green
          Write-Host ""

      # INSTALL USEFUL TOOLS
      - name: 🛠️ INSTALL USEFUL TOOLS
        run: |
          Write-Host "═══════════════════════════════════════════" -ForegroundColor Yellow
          Write-Host "          🛠️  INSTALLING TOOLS" -ForegroundColor Yellow
          Write-Host "═══════════════════════════════════════════" -ForegroundColor Yellow
          Write-Host ""
          
          Write-Host "📦 Installing Chocolatey..." -ForegroundColor Cyan
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          try {
              Invoke-Expression ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
              Write-Host "  ✓ Chocolatey installed" -ForegroundColor Green
          } catch {
              Write-Host "  ⚠️  Chocolatey install failed" -ForegroundColor Yellow
          }
          
          Write-Host ""
          Write-Host "🌐 Installing Google Chrome..." -ForegroundColor Cyan
          choco install googlechrome -y --ignore-checksums --no-progress | Out-Null
          Write-Host "  ✓ Chrome installed" -ForegroundColor Green
          
          Write-Host ""
          Write-Host "📝 Installing Notepad++..." -ForegroundColor Cyan
          choco install notepadplusplus -y --ignore-checksums --no-progress | Out-Null
          Write-Host "  ✓ Notepad++ installed" -ForegroundColor Green
          
          Write-Host ""
          Write-Host "📂 Installing 7-Zip..." -ForegroundColor Cyan
          choco install 7zip -y --ignore-checksums --no-progress | Out-Null
          Write-Host "  ✓ 7-Zip installed" -ForegroundColor Green
          
          Write-Host ""
          Write-Host "✅ Tools installed!" -ForegroundColor Green
          Write-Host ""

      # CONFIGURE RDP
      - name: 🔧 CONFIGURE RDP
        run: |
          Write-Host "═══════════════════════════════════════════" -ForegroundColor Yellow
          Write-Host "            🔧 CONFIGURE RDP" -ForegroundColor Yellow
          Write-Host "═══════════════════════════════════════════" -ForegroundColor Yellow
          Write-Host ""
          
          Write-Host "⚙️  Enabling RDP..." -ForegroundColor Cyan
          
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fSingleSessionPerUser" -Value 0 -Force -ErrorAction SilentlyContinue
          
          Write-Host "  ✓ RDP enabled" -ForegroundColor Green
          
          Write-Host ""
          Write-Host "🔥 Configuring firewall..." -ForegroundColor Cyan
          
          netsh advfirewall firewall delete rule name="RDP-Roblox" 2>$null | Out-Null
          netsh advfirewall firewall add rule name="RDP-Roblox-In" dir=in action=allow protocol=TCP localport=3389 profile=any | Out-Null
          netsh advfirewall firewall add rule name="RDP-Roblox-Out" dir=out action=allow protocol=TCP localport=3389 profile=any | Out-Null
          
          Write-Host "  ✓ Firewall configured" -ForegroundColor Green
          
          Write-Host ""
          Write-Host "🚀 Starting RDP service..." -ForegroundColor Cyan
          
          Set-Service -Name TermService -StartupType Automatic -ErrorAction SilentlyContinue
          Restart-Service -Name TermService -Force -ErrorAction SilentlyContinue
          Start-Service -Name TermService -ErrorAction SilentlyContinue
          
          $service = Get-Service -Name TermService
          if ($service.Status -eq 'Running') {
              Write-Host "  ✓ RDP service running" -ForegroundColor Green
          } else {
              Write-Host "  ⚠️  RDP service status: $($service.Status)" -ForegroundColor Yellow
          }
          
          Write-Host ""
          Write-Host "✅ RDP configuration completed!" -ForegroundColor Green
          Write-Host ""

      # CREATE USER
      - name: 👤 CREATE USER ACCOUNT
        run: |
          Write-Host "═══════════════════════════════════════════" -ForegroundColor Yellow
          Write-Host "          👤 CREATE USER ACCOUNT" -ForegroundColor Yellow
          Write-Host "═══════════════════════════════════════════" -ForegroundColor Yellow
          Write-HoleTransparency" -Value 1 -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" -Name "VisualFXSetting" -Value 1 -Force -ErrorAction SilentlyContinue
              Write-Host "  ✓ Visual effects enabled (Better for 3D)" -ForegroundColor Green
          } else {
              # Disable for performance
              Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Name "EnableTransparency" -Value 0 -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" -Name "VisualFXSetting" -Value 2 -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path "HKCU:\Control Panel\Desktop\WindowMetrics" -Name "MinAnimate" -Value "0" -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" -Name "TaskbarAnimations" -Value 0 -Force -ErrorAction SilentlyContinue
              Write-Host "  ✓ Minimal visual effects (Max performance)" -ForegroundColor Green
          }
          
          # Font smoothing (penting untuk UI Roblox Studio)
          if ($fontSmooth) {
              Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "FontSmoothing" -Value "2" -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "FontSmoothingType" -Value 2 -Force -ErrorAction SilentlyContinue
              Write-Host "  ✓ Font smoothing enabled (Better readability)" -ForegroundColor Green
          }
          
          # === RDP OPTIMIZATION FOR 3D ===
          Write-Host ""
          Write-Host "🌐 Optimizing RDP for 3D rendering..." -ForegroundColor Cyan
          
          $rdpPath = "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"
          
          # Color depth
          Set-ItemProperty -Path $rdpPath -Name "ColorDepth" -Value $colorDepth -Force -ErrorAction SilentlyContinue
          
          # Compression
          Set-ItemProperty -Path $rdpPath -Name "fEnableCompression" -Value $compression -Force -ErrorAction SilentlyContinue
          
          # Desktop composition (penting untuk 3D)
          if ($visualFX) {
              Set-ItemProperty -Path $rdpPath -Name "fDisableThemes" -Value 0 -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $rdpPath -Name "fDisableWallpaper" -Value 0 -Force -ErrorAction SilentlyContinue
          } else {
              Set-ItemProperty -Path $rdpPath -Name "fDisableThemes" -Value 1 -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $rdpPath -Name "fDisableWallpaper" -Value 1 -Force -ErrorAction SilentlyContinue
          }
          
          # Cursor settings (penting untuk precision 3D work)
          Set-ItemProperty -Path $rdpPath -Name "fDisableCursorShadow" -Value 0 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $rdpPath -Name "fDisableCursorBlink" -Value 0 -Force -ErrorAction SilentlyContinue
          
          # Menu animations (disable untuk performance)
          Set-ItemProperty -Path $rdpPath -Name "fDisableMenuAnims" -Value 1 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $rdpPath -Name "fDisableFullWindowDrag" -Value 1 -Force -ErrorAction SilentlyContinue
          
          Write-Host "  ✓ RDP configured for 3D workload" -ForegroundColor Green
          
          # === NETWORK OPTIMIZATION ===
          Write-Host ""
          Write-Host "🌐 Optimizing network for low latency..." -ForegroundColor Cyan
          
          # TCP optimization
          netsh int tcp set global autotuninglevel=normal | Out-Null
          netsh int tcp set global chimney=disabled | Out-Null
          netsh int tcp set global rss=enabled | Out-Null
          netsh int tcp set global netdma=disabled | Out-Null
          netsh int tcp set global dca=enabled | Out-Null
          netsh int tcp set global ecncapability=enabled | Out-Null
          
          # Set TCP parameters for better RDP performance
          netsh int tcp set supplemental template=internet congestionprovider=ctcp | Out-Null
          
          Write-Host "  ✓ Network optimized for low latency" -ForegroundColor Green
          
          # === POWER PLAN ===
          Write-Host ""
          Write-Host "⚡ Setting high performance power plan..." -ForegroundColor Cyan
          
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c | Out-Null
          powercfg /change monitor-timeout-ac 0 | Out-Null
          powercfg /change disk-timeout-ac 0 | Out-Null
          powercfg /change standby-timeout-ac 0 | Out-Null
          
          Write-Host "  ✓ High performance mode activated" -ForegroundColor Green
          
          # === REGISTRY TWEAKS ===
          Write-Host ""
          Write-Host "🔧 Applying registry performance tweaks..." -ForegroundColor Cyan
          
          # Speed up menu
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "MenuShowDelay" -Value "0" -Force -ErrorAction SilentlyContinue
          
          # Mouse precision (penting untuk 3D work)
          Set-ItemProperty -Path "HKCU:\Control Panel\Mouse" -Name "MouseSpeed" -Value "0" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKCU:\Control Panel\Mouse" -Name "MouseThreshold1" -Value "0" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKCU:\Control Panel\Mouse" -Name "MouseThreshold2" -Value "0" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKCU:\Control Panel\Mouse" -Name "MouseHoverTime" -Value "100" -Force -ErrorAction SilentlyContinue
          
          # Keyboard response
          Set-ItemProperty -Path "HKCU:\Control Panel\Keyboard" -Name "KeyboardDelay" -Value "0" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKCU:\Control Panel\Keyboard" -Name "KeyboardSpeed" -Value "31" -Force -ErrorAction SilentlyContinue
          
          Write-Host "  ✓ Registry tweaks applied" -ForegroundColor Green
          
          # === GPU OPTIMIZATION ===
          Write-Host ""
          Write-Host "🎨 Optimizing GPU settings..." -ForegroundColor Cyan
          
          # Enable hardware acceleration
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Avalon.Graphics" -Name "DisableHWAcceleration" -Value 0 -Force -ErrorAction SilentlyContinue
          
          Write-Host "  ✓ Hardware acceleration enabled" -ForegroundColor Green
          
          # Save settings to env
          echo "RDP_COLOR_DEPTH=$colorDepth" >> $env:GITHUB_ENV
          echo "RDP_WIDTH=$($resolution[0])" >> $env:GITHUB_ENV
          echo "RDP_HEIGHT=$($resolution[1])" >> $env:GITHUB_ENV
          echo "RDP_COMPRESSION=$compression" >> $env:GITHUB_ENV
          
          Write-Host ""
          Write-Host "✅ Roblox Studio optimization completed!" -ForegroundColor Green
          Write-Host ""

      # INSTALL ROBLOX STUDIO
      - name: 🎮 INSTALL ROBLOX STUDIO
        run: |
          Write-Host "═══════════════════════════════════════════" -ForegroundColor Yellow
          Write-Host "        🎮 INSTALLING ROBLOX STUDIO" -ForegroundColor Yellow
          Write-Host "═══════════════════════════════════════════" -ForegroundColor Yellow
          Write-Host ""
          
          Write-Host "📥 Downloading Roblox Studio installer..." -ForegroundColor Cyan
          
          $installerPath = "$env:TEMP\RobloxStudioInstaller.exe"
          $downloadUrl = "https://setup.rbxcdn.com/RobloxStudioLauncherBeta.exe"
          
          try {
              # Download with progress
              $ProgressPreference = 'SilentlyContinue'
              Invoke-WebRequest -Uri $downloadUrl -OutFile $installerPath -UseBasicParsing
              $ProgressPreference = 'Continue'
              
              Write-Host "  ✓ Downloaded successfully!" -ForegroundColor Green
              Write-Host ""
              
              Write-Host "⚙️  Installing Roblox Studio..." -ForegroundColor Cyan
