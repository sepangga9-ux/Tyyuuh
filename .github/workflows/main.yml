name: 🚀 RDP ULTRA LIGHT - MOBILE OPTIMIZED

on:
  workflow_dispatch:
    inputs:
      duration:
        description: '🕐 Thời gian sử dụng'
        required: false
        default: '5h50m'
        type: choice
        options:
        - '1h'
        - '3h' 
        - '5h50m'
        - '11h40m'
        - '23h20m'

jobs:
  Ultra-Light-RDP:
    runs-on: windows-latest
    timeout-minutes: 360
    
    steps:
      # BANNER CHÀO MỪNG
      - name: 🎯 KHỞI ĐỘNG HỆ THỐNG ULTRA LIGHT
        run: |
          Write-Host ""
          Write-Host "📱 RDP ULTRA LIGHT - MOBILE OPTIMIZED" -ForegroundColor Cyan
          Write-Host "⚡ Optimized for Low-End Phones" -ForegroundColor Green
          Write-Host "🕒 Thời gian: ${{ github.event.inputs.duration }}" -ForegroundColor Magenta
          Write-Host "🎨 Performance Mode: ULTRA LIGHT" -ForegroundColor Yellow
          Write-Host ""
          
          # Hiệu ứng loading
          $frames = @('⣾', '⣽', '⣻', '⢿', '⡿', '⣟', '⣯', '⣷')
          for($i=0; $i -lt 10; $i++) {
              Write-Host "`r🚀 Đang khởi tạo... $($frames[$i % 8])" -NoNewline -ForegroundColor Blue
              Start-Sleep -Milliseconds 100
          }
          Write-Host "`r✅ Hệ thống sẵn sàng!     " -ForegroundColor Green

      # OPTIMASI ULTRA LIGHT
      - name: ⚡ OPTIMASI PERFORMA ULTRA LIGHT
        run: |
          Write-Host ""
          Write-Host "⚡ ĐANG OPTIMASI PERFORMA CHO MOBILE..." -ForegroundColor Yellow
          
          # === DISABLE VISUAL EFFECTS ===
          Write-Host "│ 🎨 Tắt hiệu ứng đồ họa..." -ForegroundColor White
          
          # Disable Aero & Transparency
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Name "EnableTransparency" -Value 0 -Force -ErrorAction SilentlyContinue
          
          # Disable animations
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop\WindowMetrics" -Name "MinAnimate" -Value "0" -Force -ErrorAction SilentlyContinue
          
          # Performance mode for visual effects
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" -Name "VisualFXSetting" -Value 2 -Force -ErrorAction SilentlyContinue
          
          # Disable taskbar animations
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" -Name "TaskbarAnimations" -Value 0 -Force -ErrorAction SilentlyContinue
          
          # === OPTIMIZE RDP SETTINGS ===
          Write-Host "│ 🌐 Optimasi RDP settings..." -ForegroundColor White
          
          # Set RDP to performance mode
          $rdpPath = "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"
          
          # Disable wallpaper
          Set-ItemProperty -Path $rdpPath -Name "fDisableWallpaper" -Value 1 -Force -ErrorAction SilentlyContinue
          
          # Disable full window drag
          Set-ItemProperty -Path $rdpPath -Name "fDisableFullWindowDrag" -Value 1 -Force -ErrorAction SilentlyContinue
          
          # Disable menu animations
          Set-ItemProperty -Path $rdpPath -Name "fDisableMenuAnims" -Value 1 -Force -ErrorAction SilentlyContinue
          
          # Disable themes
          Set-ItemProperty -Path $rdpPath -Name "fDisableThemes" -Value 1 -Force -ErrorAction SilentlyContinue
          
          # Disable cursor shadow
          Set-ItemProperty -Path $rdpPath -Name "fDisableCursorShadow" -Value 1 -Force -ErrorAction SilentlyContinue
          
          # Disable cursor blink
          Set-ItemProperty -Path $rdpPath -Name "fDisableCursorBlink" -Value 1 -Force -ErrorAction SilentlyContinue
          
          # Set color depth to 16-bit (hemat bandwidth)
          Set-ItemProperty -Path $rdpPath -Name "ColorDepth" -Value 2 -Force -ErrorAction SilentlyContinue
          
          # Enable compression
          Set-ItemProperty -Path $rdpPath -Name "fEnableCompression" -Value 1 -Force -ErrorAction SilentlyContinue
          
          # === DISABLE UNNECESSARY SERVICES ===
          Write-Host "│ 🛑 Tắt service tidak perlu..." -ForegroundColor White
          
          $servicesToDisable = @(
              "WSearch",           # Windows Search
              "SysMain",           # Superfetch
              "TabletInputService", # Touch keyboard
              "Themes",            # Windows Themes
              "WbioSrvc",          # Windows Biometric
              "fhsvc"              # File History
          )
          
          foreach($svc in $servicesToDisable) {
              try {
                  Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
                  Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
              } catch {
                  # Ignore errors
              }
          }
          
          # === OPTIMIZE NETWORK ===
          Write-Host "│ 🌐 Optimasi network..." -ForegroundColor White
          
          # Disable Large Send Offload
          netsh int tcp set global autotuninglevel=normal
          
          # Set TCP optimizer
          netsh int tcp set global chimney=disabled
          netsh int tcp set global rss=enabled
          netsh int tcp set global netdma=disabled
          
          # === CLEAN TEMP FILES ===
          Write-Host "│ 🧹 Membersihkan file temporary..." -ForegroundColor White
          
          Remove-Item -Path "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Windows\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue
          
          # === DISABLE WINDOWS UPDATE DURING SESSION ===
          Write-Host "│ ⏸️  Pause Windows Update..." -ForegroundColor White
          
          Stop-Service -Name wuauserv -Force -ErrorAction SilentlyContinue
          Set-Service -Name wuauserv -StartupType Disabled -ErrorAction SilentlyContinue
          
          # === PERFORMANCE REGISTRY TWEAKS ===
          Write-Host "│ 🔧 Registry performance tweaks..." -ForegroundColor White
          
          # Speed up menu show delay
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "MenuShowDelay" -Value "0" -Force -ErrorAction SilentlyContinue
          
          # Reduce mouse hover time
          Set-ItemProperty -Path "HKCU:\Control Panel\Mouse" -Name "MouseHoverTime" -Value "100" -Force -ErrorAction SilentlyContinue
          
          # Disable smooth scrolling
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "SmoothScroll" -Value 0 -Force -ErrorAction SilentlyContinue
          
          # Disable font smoothing
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "FontSmoothing" -Value "0" -Force -ErrorAction SilentlyContinue
          
          Write-Host "✅ Optimasi Ultra Light selesai!" -ForegroundColor Green

      # CẤU HÌNH RDP
      - name: 🔧 CẤU HÌNH RDP
        run: |
          Write-Host ""
          Write-Host "🛠️  CẤU HÌNH RDP" -ForegroundColor Yellow
          
          # Enable RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          
          # Disable NLA
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          
          # Firewall rules
          netsh advfirewall firewall add rule name="RDP-UltraLight" dir=in action=allow protocol=TCP localport=3389 profile=any | Out-Null
          netsh advfirewall firewall add rule name="RDP-UltraLight-Out" dir=out action=allow protocol=TCP localport=3389 profile=any | Out-Null
          
          # Start services
          Set-Service -Name TermService -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name TermService -ErrorAction SilentlyContinue
          
          Write-Host "✅ RDP configured!" -ForegroundColor Green

      # CREATE USER
      - name: 👤 TẠO USER
        run: |
          Write-Host ""
          Write-Host "👤 TẠO TÀI KHOẢN" -ForegroundColor Yellow
          
          # Generate password
          function New-SecurePassword {
              $chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#$%&*+-='
              return -join ((1..12) | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          }
          
          $password = New-SecurePassword
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          # Remove old user
          Remove-LocalUser -Name "MOBILE-RDP" -ErrorAction SilentlyContinue
          
          # Create new user
          New-LocalUser -Name "MOBILE-RDP" -Password $securePass -AccountNeverExpires -Description "Mobile Optimized RDP"
          Set-LocalUser -Name "MOBILE-RDP" -PasswordNeverExpires $true
          
          # Add to groups
          Add-LocalGroupMember -Group "Administrators" -Member "MOBILE-RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "MOBILE-RDP" -ErrorAction SilentlyContinue
          
          Enable-LocalUser -Name "MOBILE-RDP"
          
          # Save credentials
          echo "RDP_USER=MOBILE-RDP" >> $env:GITHUB_ENV
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV
          echo "$password" > $env:TEMP\rdp_pass.txt
          
          Write-Host "✅ User created: MOBILE-RDP" -ForegroundColor Green

      # TAILSCALE SETUP
      - name: 🌐 SETUP TAILSCALE
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host ""
          Write-Host "🌐 SETUP NETWORK" -ForegroundColor Yellow
          
          # Download & Install
          $msiPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msiPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$msiPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $msiPath -Force -ErrorAction SilentlyContinue
          
          Start-Sleep -Seconds 10
          
          # Connect
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=mobile-rdp-$env:GITHUB_RUN_ID --accept-routes --accept-dns --reset
          
          # Get IP
          $ip = $null
          for($i=0; $i -lt 15; $i++) {
              $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>&1
              if ($ip -and $ip -match '^\d+\.\d+\.\d+\.\d+$') {
                  echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
                  Write-Host "✅ IP: $ip" -ForegroundColor Green
                  break
              }
              Start-Sleep -Seconds 3
          }
          
          if (-not $ip -or $ip -notmatch '^\d+\.\d+\.\d+\.\d+$') {
              echo "TAILSCALE_IP=localhost" >> $env:GITHUB_ENV
          }

      # CREATE RDP CONFIG FILE
      - name: 📄 CREATE RDP CONFIG FILE
        run: |
          Write-Host ""
          Write-Host "📄 CREATING OPTIMIZED RDP CONFIG..." -ForegroundColor Yellow
          
          $rdpConfig = @"
screen mode id:i:2
use multimon:i:0
desktopwidth:i:1024
desktopheight:i:768
session bpp:i:16
winposstr:s:0,1,0,0,800,600
compression:i:1
keyboardhook:i:2
audiocapturemode:i:0
videoplaybackmode:i:1
connection type:i:6
networkautodetect:i:1
bandwidthautodetect:i:1
displayconnectionbar:i:1
enableworkspacereconnect:i:0
disable wallpaper:i:1
allow font smoothing:i:0
allow desktop composition:i:0
disable full window drag:i:1
disable menu anims:i:1
disable themes:i:1
disable cursor setting:i:1
bitmapcachepersistenable:i:1
full address:s:$env:TAILSCALE_IP
audiomode:i:2
redirectprinters:i:0
redirectcomports:i:0
redirectsmartcards:i:0
redirectclipboard:i:1
redirectposdevices:i:0
autoreconnection enabled:i:1
authentication level:i:0
prompt for credentials:i:0
negotiate security layer:i:0
remoteapplicationmode:i:0
alternate shell:s:
shell working directory:s:
gatewayhostname:s:
gatewayusagemethod:i:4
gatewaycredentialssource:i:4
gatewayprofileusagemethod:i:0
promptcredentialonce:i:0
gatewaybrokeringtype:i:0
use redirection server name:i:0
rdgiskdcproxy:i:0
kdcproxyname:s:
"@
          
          $rdpConfig | Out-File -FilePath "$env:TEMP\mobile-optimized.rdp" -Encoding ASCII
          
          Write-Host "✅ RDP config created at: $env:TEMP\mobile-optimized.rdp" -ForegroundColor Green
          Write-Host "│ Resolution: 1024x768" -ForegroundColor Cyan
          Write-Host "│ Color Depth: 16-bit" -ForegroundColor Cyan
          Write-Host "│ Compression: Enabled" -ForegroundColor Cyan
          Write-Host "│ All visual effects: Disabled" -ForegroundColor Cyan

      # DISPLAY INFO
      - name: 🎉 THÔNG TIN KẾT NỐI
        run: |
          $password = Get-Content $env:TEMP\rdp_pass.txt -ErrorAction SilentlyContinue
          
          # Calculate time
          $durationInput = "${{ github.event.inputs.duration }}"
          switch ($durationInput) {
              "1h" { $totalMinutes = 60; $displayTime = "1 giờ" }
              "3h" { $totalMinutes = 180; $displayTime = "3 giờ" }
              "5h50m" { $totalMinutes = 350; $displayTime = "5 giờ 50 phút" }
              "11h40m" { $totalMinutes = 700; $displayTime = "11 giờ 40 phút" }
              "23h20m" { $totalMinutes = 1400; $displayTime = "23 giờ 20 phút" }
          }
          
          $timeZone = [System.TimeZoneInfo]::FindSystemTimeZoneById("SE Asia Standard Time")
          $startTime = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $timeZone)
          $endTime = $startTime.AddMinutes($totalMinutes)
          
          Write-Host ""
          Write-Host "┌────────────────────────────────────────────┐" -ForegroundColor Cyan
          Write-Host "│       📱 RDP ULTRA LIGHT - READY!          │" -ForegroundColor Cyan
          Write-Host "├────────────────────────────────────────────┤" -ForegroundColor Cyan
          Write-Host "│ 🌐  IP: $env:TAILSCALE_IP" -ForegroundColor White
          Write-Host "│ 👤  User: MOBILE-RDP" -ForegroundColor White
          Write-Host "│ 🔐  Pass: $password" -ForegroundColor White
          Write-Host "│ 📍  Port: 3389" -ForegroundColor White
          Write-Host "│ ⏰  Durasi: $displayTime" -ForegroundColor White
          Write-Host "│ 🕐  Start: $($startTime.ToString('HH:mm:ss'))" -ForegroundColor White
          Write-Host "│ 🕐  End: $($endTime.ToString('HH:mm:ss'))" -ForegroundColor White
          Write-Host "├────────────────────────────────────────────┤" -ForegroundColor Cyan
          Write-Host "│ ⚡ ULTRA LIGHT SETTINGS:                   │" -ForegroundColor Yellow
          Write-Host "│   • Resolution: 1024x768                    │" -ForegroundColor Green
          Write-Host "│   • Color: 16-bit                          │" -ForegroundColor Green
          Write-Host "│   • Compression: ON                        │" -ForegroundColor Green
          Write-Host "│   • Visual Effects: OFF                    │" -ForegroundColor Green
          Write-Host "│   • Optimized for Mobile                   │" -ForegroundColor Green
          Write-Host "├────────────────────────────────────────────┤" -ForegroundColor Cyan
          Write-Host "│ 📱 TIPS UNTUK HP:                          │" -ForegroundColor Cyan
          Write-Host "│   • Gunakan WiFi untuk koneksi stabil       │" -ForegroundColor Yellow
          Write-Host "│   • Matikan notifikasi saat RDP aktif       │" -ForegroundColor Yellow
          Write-Host "│   • Mode landscape lebih nyaman             │" -ForegroundColor Yellow
          Write-Host "└────────────────────────────────────────────┘" -ForegroundColor Cyan
          
          echo "TOTAL_MINUTES=$totalMinutes" >> $env:GITHUB_ENV

      # KEEP ALIVE WITH AUTO-RESTART
      - name: ⏳ KEEP ALIVE
        run: |
          $password = Get-Content $env:TEMP\rdp_pass.txt -ErrorAction SilentlyContinue
          $totalMinutes = $env:TOTAL_MINUTES
          
          $timeZone = [System.TimeZoneInfo]::FindSystemTimeZoneById("SE Asia Standard Time")
          $startTime = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $timeZone)
          $endTime = $startTime.AddMinutes($totalMinutes)
          
          Write-Host ""
          Write-Host "🔄 MAINTAINING SESSION..." -ForegroundColor Yellow
          Write-Host "💎 Mode: ULTRA LIGHT" -ForegroundColor Magenta
          Write-Host "🔗 IP: $env:TAILSCALE_IP" -ForegroundColor Cyan
          Write-Host ""
          
          # Monitor script
          $monitorScript = {
              while ($true) {
                  $termService = Get-Service -Name TermService -ErrorAction SilentlyContinue
                  if ($termService.Status -ne 'Running') {
                      Start-Service -Name TermService -ErrorAction SilentlyContinue
                  }
                  Start-Sleep -Seconds 60
              }
          }
          
          Start-Job -ScriptBlock $monitorScript -Name "Monitor"
          
          # Timer
          $frames = @('⠋', '⠙', '⠹', '⠸', '⠼', '⠴', '⠦', '⠧', '⠇', '⠏')
          $colors = @('Red', 'Yellow', 'Green', 'Cyan', 'Blue', 'Magenta')
          
          do {
              $currentTime = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $timeZone)
              $remaining = $endTime - $currentTime
              
              $hours = [math]::Max(0, [math]::Floor($remaining.TotalHours))
              $minutes = [math]::Max(0, [math]::Floor($remaining.TotalMinutes % 60))
              $seconds = [math]::Max(0, [math]::Floor($remaining.TotalSeconds % 60))
              
              $frame = $frames[([int](Get-Date).Second) % $frames.Length]
              $color = $colors[([int](Get-Date).Minute) % $colors.Length]
              
              Write-Host "`r$frame [$($currentTime.ToString('HH:mm:ss'))] ⏰ $hours h $minutes m $seconds s" -NoNewline -ForegroundColor $color
              
              Start-Sleep -Seconds 5
              
          } while ($remaining.TotalSeconds -gt 0)
          
          Write-Host ""
          Write-Host "🎯 SESSION COMPLETED!" -ForegroundColor Green
          
          Get-Job -Name "Monitor" -ErrorAction SilentlyContinue | Stop-Job -PassThru | Remove-Job -Force

      # CLEANUP
      - name: 🧹 CLEANUP
        if: always()
        run: |
          Write-Host ""
          Write-Host "🧹 CLEANING UP..." -ForegroundColor Yellow
          
          Remove-Item "$env:TEMP\rdp_pass.txt" -ErrorAction SilentlyContinue
          Remove-Item "$env:TEMP\mobile-optimized.rdp" -ErrorAction SilentlyContinue
          Disable-LocalUser -Name "MOBILE-RDP" -ErrorAction SilentlyContinue
          & "$env:ProgramFiles\Tailscale\tailscale.exe" down --accept-risk=all -ErrorAction SilentlyContinue
          netsh advfirewall firewall delete rule name="RDP-UltraLight" -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 1 -Force -ErrorAction SilentlyContinue
          
          Get-Job | Stop-Job -PassThru | Remove-Job -Force -ErrorAction SilentlyContinue
          
          Write-Host "✅ Cleanup complete!" -ForegroundColor Green
          }
          Write-Host "`r✅ Hệ thống đã sẵn sàng!                    " -ForegroundColor Green

      # CẤU HÌNH NÂNG CAO
      - name: 🔧 CẤU HÌNH HỆ THỐNG
        run: |
          Write-Host ""
          Write-Host "🛠️  ĐANG CẤU HÌNH HỆ THỐNG" -ForegroundColor Yellow
          
          $steps = @(
              @{Name="Bật Remote Desktop"; Script={
                  Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
                  Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
              }},
              @{Name="Tắt xác thực mạng"; Script={
                  Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
              }},
              @{Name="Cấu hình bảo mật RDP"; Script={
                  Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
                  Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
              }},
              @{Name="Mở port 3389 firewall"; Script={
                  netsh advfirewall firewall add rule name="RDP-Premium" dir=in action=allow protocol=TCP localport=3389 profile=any
                  netsh advfirewall firewall add rule name="RDP-Premium-Out" dir=out action=allow protocol=TCP localport=3389 profile=any
              }},
              @{Name="Khởi động dịch vụ"; Script={
                  Set-Service -Name TermService -StartupType Automatic -ErrorAction SilentlyContinue
                  Set-Service -Name UmRdpService -StartupType Automatic -ErrorAction SilentlyContinue
                  Start-Service -Name TermService -ErrorAction SilentlyContinue
                  Start-Service -Name UmRdpService -ErrorAction SilentlyContinue
              }}
          )
          
          foreach($step in $steps) {
              Write-Host "│ 📋 $($step.Name)..." -NoNewline -ForegroundColor White
              try {
                  & $step.Script
                  Write-Host "`r│ ✅ $($step.Name)" -ForegroundColor Green
              } catch {
                  Write-Host "`r│ ⚠️  $($step.Name) - Đã bỏ qua lỗi nhỏ" -ForegroundColor Yellow
              }
              Start-Sleep -Milliseconds 500
          }
          
          Write-Host "🎯 Cấu hình hoàn tất!" -ForegroundColor Green

      # TẠO USER PREMIUM - ĐÃ SỬA LỖI
      - name: 👤 TẠO TÀI KHOẢN PREMIUM
        run: |
          Write-Host ""
          Write-Host "👤 ĐANG TẠO TÀI KHOẢN PREMIUM" -ForegroundColor Yellow
          
          # Tạo password siêu bảo mật
          function New-PremiumPassword {
              $upper = 'ABCDEFGHJKLMNPQRSTUVWXYZ'
              $lower = 'abcdefghijkmnpqrstuvwxyz'
              $numbers = '23456789'
              $symbols = '!@#$%&*+-='
              
              $password = @(
                  ($upper.ToCharArray() | Get-Random -Count 3) -join '',
                  ($lower.ToCharArray() | Get-Random -Count 3) -join '',
                  ($numbers.ToCharArray() | Get-Random -Count 3) -join '',
                  ($symbols.ToCharArray() | Get-Random -Count 3) -join ''
              ) -join ''
              
              return -join ($password.ToCharArray() | Sort-Object {Get-Random})
          }
          
          $matKhau = New-PremiumPassword
          $securePass = ConvertTo-SecureString $matKhau -AsPlainText -Force
          
          # Xóa user cũ nếu tồn tại
          try {
              Remove-LocalUser -Name "AISTV-PREMIUM" -ErrorAction SilentlyContinue
              Write-Host "│ ✅ Đã xóa user cũ" -ForegroundColor Green
          } catch {
              Write-Host "│ ℹ️  Không có user cũ để xóa" -ForegroundColor Blue
          }
          
          # Tạo user mới với đầy đủ quyền - ĐÃ SỬA LỖI
          try {
              # SỬA LỖI: Tạo user không dùng PasswordNeverExpires parameter
              New-LocalUser -Name "AISTV-PREMIUM" -Password $securePass -AccountNeverExpires -Description "AI STV Premium Account"
              Write-Host "│ ✅ Đã tạo user mới" -ForegroundColor Green
              
              # Thiết lập mật khẩu không bao giờ hết hạn
              Set-LocalUser -Name "AISTV-PREMIUM" -PasswordNeverExpires $true
              
              # Thêm vào các nhóm cần thiết
              Add-LocalGroupMember -Group "Administrators" -Member "AISTV-PREMIUM" -ErrorAction SilentlyContinue
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member "AISTV-PREMIUM" -ErrorAction SilentlyContinue
              Add-LocalGroupMember -Group "Users" -Member "AISTV-PREMIUM" -ErrorAction SilentlyContinue
              
              # Kích hoạt user
              Enable-LocalUser -Name "AISTV-PREMIUM"
              
              Write-Host "│ ✅ Đã cấp quyền Administrator & RDP" -ForegroundColor Green
              
          } catch {
              Write-Host "│ ❌ Lỗi tạo user: $($_.Exception.Message)" -ForegroundColor Red
              exit 1
          }
          
          # Lưu thông tin
          echo "RDP_USER=AISTV-PREMIUM" >> $env:GITHUB_ENV
          echo "RDP_PASS=$matKhau" >> $env:GITHUB_ENV
          echo "$matKhau" > $env:TEMP\rdp_password.txt
          
          Write-Host "✅ Tài khoản: AISTV-PREMIUM đã sẵn sàng" -ForegroundColor Green

      # KIỂM TRA QUYỀN ĐĂNG NHẬP
      - name: 🔍 KIỂM TRA QUYỀN HỆ THỐNG
        run: |
          Write-Host ""
          Write-Host "🔍 KIỂM TRA QUYỀN ĐĂNG NHẬP" -ForegroundColor Yellow
          
          # Kiểm tra user tồn tại
          $user = Get-LocalUser -Name "AISTV-PREMIUM" -ErrorAction SilentlyContinue
          if ($user) {
              Write-Host "│ ✅ User AISTV-PREMIUM tồn tại" -ForegroundColor Green
              Write-Host "│ 📊 Trạng thái: $($user.Enabled)" -ForegroundColor White
          } else {
              Write-Host "│ ❌ User không tồn tại" -ForegroundColor Red
              exit 1
          }
          
          # Kiểm tra quyền Administrator
          $isAdmin = (Get-LocalGroupMember -Group "Administrators" | Where-Object {$_.Name -like "*AISTV-PREMIUM"}).Count -gt 0
          if ($isAdmin) {
              Write-Host "│ ✅ Có quyền Administrator" -ForegroundColor Green
          } else {
              Write-Host "│ ❌ Không có quyền Administrator" -ForegroundColor Red
          }
          
          # Kiểm tra quyền Remote Desktop
          $isRDPUser = (Get-LocalGroupMember -Group "Remote Desktop Users" | Where-Object {$_.Name -like "*AISTV-PREMIUM"}).Count -gt 0
          if ($isRDPUser) {
              Write-Host "│ ✅ Có quyền Remote Desktop" -ForegroundColor Green
          } else {
              Write-Host "│ ❌ Không có quyền Remote Desktop" -ForegroundColor Red
          }
          
          # Kiểm tra dịch vụ RDP
          $termService = Get-Service -Name TermService -ErrorAction SilentlyContinue
          if ($termService.Status -eq 'Running') {
              Write-Host "│ ✅ Dịch vụ TermService đang chạy" -ForegroundColor Green
          } else {
              Write-Host "│ ❌ Dịch vụ TermService không chạy" -ForegroundColor Red
          }
          
          Write-Host "🎯 Kiểm tra hoàn tất!" -ForegroundColor Green

      # TAILSCALE PREMIUM
      - name: 🌐 THIẾT LẬP MẠNG PREMIUM
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host ""
          Write-Host "🌐 ĐANG THIẾT LẬP KẾT NỐI MẠNG" -ForegroundColor Yellow
          
          # Cài đặt Tailscale
          try {
              $msiPath = "$env:TEMP\tailscale-premium.msi"
              Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msiPath
              Start-Process msiexec.exe -ArgumentList "/i", "`"$msiPath`"", "/quiet", "/norestart" -Wait
              Remove-Item $msiPath -Force -ErrorAction SilentlyContinue
              Write-Host "│ ✅ Cài đặt Tailscale thành công" -ForegroundColor Green
          } catch {
              Write-Host "│ ❌ Lỗi cài đặt Tailscale" -ForegroundColor Red
          }
          
          # Chờ dịch vụ khởi động
          Start-Sleep -Seconds 10
          
          # Kết nối Tailscale
          try {
              & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=ai-stv-premium-$env:GITHUB_RUN_ID --accept-routes --accept-dns --reset
              Write-Host "│ ✅ Kết nối Tailscale thành công" -ForegroundColor Green
          } catch {
              Write-Host "│ ❌ Lỗi kết nối Tailscale" -ForegroundColor Red
          }
          
          # Lấy IP với retry mechanism
          Write-Host "🔄 Đang lấy địa chỉ IP..." -NoNewline -ForegroundColor Blue
          $ip = $null
          for($i=0; $i -lt 20; $i++) {
              try {
                  $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>&1
                  if ($ip -and $ip -match '^\d+\.\d+\.\d+\.\d+$') {
                      echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
                      Write-Host "`r✅ Địa chỉ IP: $ip" -ForegroundColor Green
                      break
                  }
              } catch {
                  # Bỏ qua lỗi và thử lại
              }
              Write-Host "`r🔄 Đang lấy địa chỉ IP... $(@('.', '..', '...')[$i % 3])" -NoNewline -ForegroundColor Blue
              Start-Sleep -Seconds 3
          }
          
          if (-not $ip -or $ip -notmatch '^\d+\.\d+\.\d+\.\d+$') {
              Write-Host "`r⚠️  Không thể lấy IP, sử dụng localhost" -ForegroundColor Yellow
              echo "TAILSCALE_IP=localhost" >> $env:GITHUB_ENV
          }

      # HIỂN THỊ GIAO DIỆN ĐẸP
      - name: 🎉 THÔNG TIN KẾT NỐI
        run: |
          $matKhau = Get-Content $env:TEMP\rdp_password.txt -ErrorAction SilentlyContinue
          if (-not $matKhau) {
              $matKhau = "Không thể đọc mật khẩu"
          }
          
          # Chuyển đổi thời gian từ input sang phút
          $durationInput = "${{ github.event.inputs.duration }}"
          switch ($durationInput) {
              "1h" { $totalMinutes = 60; $displayTime = "1 giờ" }
              "3h" { $totalMinutes = 180; $displayTime = "3 giờ" }
              "5h40m" { $totalMinutes = 340; $displayTime = "5 giờ 40 phút" }
          }
          
          # Tính thời gian chính xác
          $timeZone = [System.TimeZoneInfo]::FindSystemTimeZoneById("SE Asia Standard Time")
          $thoiGianBatDau = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $timeZone)
          $thoiGianKetThuc = $thoiGianBatDau.AddMinutes($totalMinutes)
          
          Write-Host ""
          Write-Host "┌───────────────────────────────────────────┐" -ForegroundColor Cyan
          Write-Host "│              🎉 KẾT NỐI THÀNH CÔNG!              │" -ForegroundColor Cyan
          Write-Host "├───────────────────────────────────────────┤" -ForegroundColor Cyan
          Write-Host "│ 🌐  Địa chỉ: $env:TAILSCALE_IP" -ForegroundColor White
          Write-Host "│ 👤  Tài khoản: AISTV-PREMIUM" -ForegroundColor White
          Write-Host "│ 🔐  Mật khẩu: $matKhau" -ForegroundColor White
          Write-Host "│ ⏰  Thời lượng: $displayTime" -ForegroundColor White
          Write-Host "│ 🕐  Bắt đầu: $($thoiGianBatDau.ToString('HH:mm:ss'))" -ForegroundColor White
          Write-Host "│ 🕐  Kết thúc: $($thoiGianKetThuc.ToString('HH:mm:ss'))" -ForegroundColor White
          Write-Host "│ 📍  Port: 3389" -ForegroundColor White
          Write-Host "├───────────────────────────────────────────┤" -ForegroundColor Cyan
          Write-Host "│ 💡  Hướng dẫn:                                    │" -ForegroundColor Cyan
          Write-Host "│   1. Mở Remote Desktop Connection                 │" -ForegroundColor Yellow
          Write-Host "│   2. Nhập: $env:TAILSCALE_IP                      │" -ForegroundColor Yellow
          Write-Host "│   3. User: AISTV-PREMIUM | Password: trên          │" -ForegroundColor Yellow
          Write-Host "│   4. Enjoy! 🚀                                    │" -ForegroundColor Yellow
          Write-Host "└───────────────────────────────────────────┘" -ForegroundColor Cyan
          
          # Lưu thời gian vào biến môi trường
          echo "TOTAL_MINUTES=$totalMinutes" >> $env:GITHUB_ENV

      # DUY TRÌ PHIÊN ỔN ĐỊNH
      - name: ⏳ DUY TRÌ PHIÊN LÀM VIỆC
        run: |
          $matKhau = Get-Content $env:TEMP\rdp_password.txt -ErrorAction SilentlyContinue
          $totalMinutes = $env:TOTAL_MINUTES
          
          # Tính thời gian chính xác
          $timeZone = [System.TimeZoneInfo]::FindSystemTimeZoneById("SE Asia Standard Time")
          $thoiGianBatDau = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $timeZone)
          $thoiGianKetThuc = $thoiGianBatDau.AddMinutes($totalMinutes)
          
          Write-Host ""
          Write-Host "🔄 BẮT ĐẦU DUY TRÌ PHIÊN LÀM VIỆC..." -ForegroundColor Yellow
          Write-Host "💎 Phiên: AI STV PREMIUM" -ForegroundColor Magenta
          Write-Host "🔗 Kết nối: $env:TAILSCALE_IP" -ForegroundColor Cyan
          Write-Host "🕐 Bắt đầu: $($thoiGianBatDau.ToString('HH:mm:ss'))" -ForegroundColor Green
          Write-Host "🕐 Kết thúc: $($thoiGianKetThuc.ToString('HH:mm:ss'))" -ForegroundColor Green
          Write-Host ""
          
          # Tạo process giám sát hệ thống
          $monitorScript = {
              $lastLogTime = Get-Date
              while ($true) {
                  $currentTime = Get-Date
                  
                  # Log trạng thái mỗi 2 phút
                  if (($currentTime - $lastLogTime).TotalMinutes -ge 2) {
                      # Kiểm tra dịch vụ
                      $termService = Get-Service -Name TermService -ErrorAction SilentlyContinue
                      $rdpConnections = Get-NetTCPConnection -LocalPort 3389 -ErrorAction SilentlyContinue | Where-Object {$_.State -eq 'Established'}
                      
                      Write-Host "[$($currentTime.ToString('HH:mm:ss'))] 📊 Trạng thái - RDP: $($termService.Status), Kết nối: $($rdpConnections.Count)" -ForegroundColor Blue
                      $lastLogTime = $currentTime
                  }
                  
                  # Kiểm tra và khởi động lại dịch vụ nếu cần
                  $termService = Get-Service -Name TermService -ErrorAction SilentlyContinue
                  if ($termService.Status -ne 'Running') {
                      Write-Host "[$($currentTime.ToString('HH:mm:ss'))] 🔄 Khởi động lại TermService..." -ForegroundColor Yellow
                      Start-Service -Name TermService -ErrorAction SilentlyContinue
                  }
                  
                  Start-Sleep -Seconds 30
              }
          }
          
          # Chạy monitor trong background
          Start-Job -ScriptBlock $monitorScript -Name "SystemMonitor"
          
          # Hiển thị timer chính
          $frames = @('⠋', '⠙', '⠹', '⠸', '⠼', '⠴', '⠦', '⠧', '⠇', '⠏')
          $colors = @('Red', 'Yellow', 'Green', 'Cyan', 'Blue', 'Magenta')
          $startTime = Get-Date
          
          do {
              $thoiGianHienTai = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $timeZone)
              $thoiGianConLai = $thoiGianKetThuc - $thoiGianHienTai
              
              $gioConLai = [math]::Max(0, [math]::Floor($thoiGianConLai.TotalHours))
              $phutConLai = [math]::Max(0, [math]::Floor($thoiGianConLai.TotalMinutes % 60))
              $giayConLai = [math]::Max(0, [math]::Floor($thoiGianConLai.TotalSeconds % 60))
              
              $frame = $frames[([int]((Get-Date) - $startTime).TotalSeconds) % $frames.Length]
              $color = $colors[([int]((Get-Date) - $startTime).TotalMinutes) % $colors.Length]
              
              Write-Host "`r$frame [$($thoiGianHienTai.ToString('HH:mm:ss'))] Thời gian còn lại: $gioConLai giờ $phutConLai phút $giayConLai giây" -NoNewline -ForegroundColor $color
              
              Start-Sleep -Seconds 5
              
          } while ($thoiGianConLai.TotalSeconds -gt 0)
          
          Write-Host ""
          Write-Host "🎯 ĐÃ HẾT THỜI GIAN - TỰ ĐỘNG DỪNG!" -ForegroundColor Red
          
          # Dọn dẹp jobs
          Get-Job -Name "SystemMonitor" -ErrorAction SilentlyContinue | Stop-Job -PassThru | Remove-Job -Force

      # DỌN DẸP CHUYÊN NGHIỆP
      - name: 🧹 DỌN DẸP HỆ THỐNG
        if: always()
        run: |
          Write-Host ""
          Write-Host "🧹 ĐANG DỌN DẸP HỆ THỐNG..." -ForegroundColor Yellow
          
          $cleanupSteps = @(
              @{Name="Xóa file password"; Script={
                  Remove-Item "$env:TEMP\rdp_password.txt" -ErrorAction SilentlyContinue
              }},
              @{Name="Vô hiệu hóa user"; Script={
                  Disable-LocalUser -Name "AISTV-PREMIUM" -ErrorAction SilentlyContinue
              }},
              @{Name="Đóng kết nối mạng"; Script={
                  & "$env:ProgramFiles\Tailscale\tailscale.exe" down --accept-risk=all -ErrorAction SilentlyContinue
                  Start-Sleep -Seconds 5
              }},
              @{Name="Xóa rule firewall"; Script={
                  netsh advfirewall firewall delete rule name="RDP-Premium" dir=in -ErrorAction SilentlyContinue
                  netsh advfirewall firewall delete rule name="RDP-Premium-Out" dir=out -ErrorAction SilentlyContinue
                  Remove-NetFirewallRule -DisplayName "RDP-Premium" -ErrorAction SilentlyContinue
                  Remove-NetFirewallRule -DisplayName "RDP-Premium-Out" -ErrorAction SilentlyContinue
              }},
              @{Name="Khôi phục cài đặt RDP"; Script={
                  Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 1 -Force -ErrorAction SilentlyContinue
                  Stop-Service -Name TermService -Force -ErrorAction SilentlyContinue
              }}
          )
          
          foreach($step in $cleanupSteps) {
              Write-Host "│ 🗑️  $($step.Name)..." -NoNewline -ForegroundColor Gray
              try {
                  & $step.Script
                  Write-Host "`r│ ✅ $($step.Name)" -ForegroundColor Green
              } catch {
                  Write-Host "`r│ ⚠️  $($step.Name) - Đã xử lý an toàn" -ForegroundColor Yellow
              }
              Start-Sleep -Milliseconds 300
          }
          
          # Dọn dẹp jobs còn sót
          Get-Job | Stop-Job -PassThru | Remove-Job -Force -ErrorAction SilentlyContinue
          
          Write-Host ""
          Write-Host "🎉 Dọn dẹp hoàn tất! Hẹn gặp lại! 👋" -ForegroundColor Green          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          # Bring up Tailscale with the provided auth key and set a unique hostname
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          # Wait for Tailscale to assign an IP
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          
          # Test connectivity using Test-NetConnection against the Tailscale IP on port 3389
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          
          # Keep runner active indefinitely (or until manually cancelled)
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
